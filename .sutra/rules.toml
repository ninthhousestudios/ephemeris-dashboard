# .sutra/rules.toml — Architectural constraints for the Ephemeris Dashboard
#
# Seeded as part of the deep-module refactor (yojana swe-dashboard/4).
# Vocabulary: CONTEXT.md. Decisions: docs/adr/. Routing of record:
# docs/enforcement-ledger.md.
#
# Severity levels:
#   blocking      — guard denies edits that introduce these
#   advisory      — warning in review, agent proceeds
#   informational — tracked in review output, silent otherwise
#
# Staging model: constraints that current debt violates are written ADVISORY
# now (they document the debt and create pressure) and flip to BLOCKING when
# the slice that establishes the seam lands. The flip trigger is recorded both
# here and in the enforcement ledger.

# ═══════════════════════════════════════════════════════════════════
# Ephemeris seam (PRD module ①)
# ═══════════════════════════════════════════════════════════════════
# SwissEph is the engine. Tabs and widgets must reach it through the
# `Ephemeris` interface, never the FFI package directly — that is what makes
# every Calculation testable behind a fake. Constants re-exported through
# lib/core/swe_constants.dart (swe-dashboard/22).

[[constraint]]
kind = "confined_external"
crates = ["swisseph_rs"]
allowed_in = ["lib/core/**", "test/**", "pubspec.yaml"]
name = "swisseph-behind-ephemeris-seam"
severity = "blocking"  # S4 cutover (swe-dashboard/29): package:swisseph removed; swisseph_rs confined behind Ephemeris seam + swe_constants.dart re-exports.
provenance = "CONTEXT.md §Ephemeris; yojana:swe-dashboard/29"

# ═══════════════════════════════════════════════════════════════════
# Calculation kernel chokepoint (PRD module ②)
# ═══════════════════════════════════════════════════════════════════
# Tab providers obtain a configured Ephemeris from the Calculation kernel; they
# must not reach the EphemerisRunner (the Applied Globals setter) directly.

[[constraint]]
kind = "forbidden_dep"
from = "lib/tabs/**"
to = "lib/core/ephemeris/runner.dart"
name = "tabs-use-kernel-not-runner"
severity = "blocking"  # FLIPPED 2026-07-22 (reflect L26): swe-dashboard/11 landed long ago and the trigger was never actioned; the seam is now clean (0 violations), so the debt-staging rationale no longer applies. Left advisory, it was violated again in swe-dashboard/33.
provenance = "yojana:swe-dashboard/4 §Implementation ②; reflect:L26"

# The kernel must not know about tabs. The rule above guards tabs reaching DOWN
# past the kernel; this guards the kernel reaching UP into tabs — the direction
# that had no rule at all, and that swe-dashboard/37 found runner.dart taking.
# It landed advisory because body_selection.dart's tab-provider imports and
# swe_utils.dart predated it. swe-dashboard/85 inverted that ownership — core
# now DEFINES the body selections (BodySelection registry) instead of importing
# the tabs that held them — so the stated trigger is met and it is blocking.

[[constraint]]
kind = "forbidden_dep"
from = "lib/core/**"
to = "lib/tabs/**"
name = "core-must-not-import-tabs"
severity = "blocking"  # FLIPPED 2026-07-27 (swe-dashboard/85): the stated trigger fired — body_selection.dart no longer imports tab providers and the rule has 0 detected violations.
provenance = "yojana:swe-dashboard/37; reflect:L26"

# ═══════════════════════════════════════════════════════════════════
# Tab independence
# ═══════════════════════════════════════════════════════════════════
# Tabs are independent surfaces. The co-change coupling is hidden (no static
# edges today), so this guards against NEW static cross-tab coupling.

[[constraint]]
kind = "no_cycles"
scope = "lib/tabs"
name = "tabs-acyclic"
severity = "blocking"  # already clean — locked now
provenance = "CONTEXT.md §Result; yojana:swe-dashboard/4 §Problem"

# ═══════════════════════════════════════════════════════════════════
# Context bar (PRD module ⑥)
# ═══════════════════════════════════════════════════════════════════
# The app_shell ↔ context_bar ↔ file_in_use_indicator cycle this was staged
# against is gone: the indicator reached into app_shell only for
# selectedTabProvider, which moved to lib/core/active_tab.dart in
# swe-dashboard/81. Clean today.

[[constraint]]
kind = "no_cycles"
scope = "lib/widgets/context_bar"
name = "context-bar-acyclic"
severity = "blocking"  # FLIPPED 2026-07-24 (swe-dashboard/81): the named cycle is broken, so the debt-staging rationale is spent. Flipped here rather than waiting for swe-dashboard/17 (ContextBar decomposition), which was only ever the expected *route* to breaking it — per L26, an advisory with no live debt is the thing to avoid.
provenance = "yojana:swe-dashboard/4 §Implementation ⑥"

# ═══════════════════════════════════════════════════════════════════
# Chart parsing confinement (PRD module ③)
# ═══════════════════════════════════════════════════════════════════
# Chart parsing lives in the charts_dart package, not in-tree. The dashboard
# touches it only where Charts are loaded. Bound at swe-dashboard/9 (in-tree
# chart_formats deleted, charts_dart adopted) — clean today: only
# lib/core/chart_io.dart imports package:charts_dart directly.

[[constraint]]
kind = "confined_external"
crates = ["charts_dart"]
allowed_in = ["lib/widgets/context_bar/**", "lib/core/**", "pubspec.yaml"]
name = "charts-dart-at-load-sites-only"
severity = "blocking"  # already clean — locked now
provenance = "CONTEXT.md §Chart; yojana:swe-dashboard/4 §Implementation ③"

# ═══════════════════════════════════════════════════════════════════
# DEFERRED — scope does not exist yet; uncomment + bind at the trigger
