# House Dart analyzer baseline (canonical: vidhi/vidhi-dart/analysis_options.yaml)
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Strict typing (coding_discipline: no dynamic)
    - avoid_dynamic_calls
    # Async hygiene: a Future silently dropped is a fire-and-forget bug
    - unawaited_futures
    # Errors: throw only Error/Exception, log properly.
    # (avoid_catches_without_on_clauses was dropped from the house baseline
    # itself @ swe-dashboard/93 — no local deviation needed. This app is why:
    # ADR-0001 makes a tab's result a pure function of the Context, so every
    # compute is wrapped to turn any failure into a displayed CalcError rather
    # than an escaped throw. See computeSeries in calculation/run_tab_calc.dart.
    # Empty catch bodies that swallow silently are swe-dashboard/94.)
    - only_throw_errors
    - avoid_print
    # const discipline (coding_discipline: Enforce Const Constructors)
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    # Immutability at the variable level
    - prefer_final_locals
    - prefer_final_in_for_each
    # Cascade & collection operators (coding_discipline)
    - cascade_invocations
    - prefer_spread_collections
    - prefer_if_elements_to_conditional_expressions
    # Explicit contracts
    - always_declare_return_types
