name: swe_dashboard
description: Swiss Ephemeris Dashboard — complete GUI for every Swiss Ephemeris calculation.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  swisseph_rs: ^0.2.9
  charts_dart:
    git:
      url: https://github.com/ninthhousestudios/charts_dart.git
      ref: main
  path: ^1.9.0
  cupertino_icons: ^1.0.8
  file_saver: ^0.3.1
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  file_picker: ^10.3.10
  url_launcher: ^6.3.1
  dio: ^5.7.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ephe/

dependency_overrides:
  hooks: ^2.0.2
  code_assets: ^1.2.0
