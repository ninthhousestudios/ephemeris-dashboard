name: swisseph_rs
description: >-
  Idiomatic Dart transliteration of the swisseph-rs Rust API —
  typed, stateless, isolate-safe Swiss Ephemeris bindings via FFI.
version: 0.3.0
repository: https://github.com/ninthhousestudios/swisseph_rs.dart
license: AGPL-3.0-or-later

environment:
  sdk: ^3.12.0

dependencies:
  ffi: ^2.2.0
  wasm_ffi: ^2.3.0
  web: ^1.1.0
  logging: ^1.3.0
  meta: ^1.16.0
  hooks: ^2.0.2
  code_assets: ^1.2.0

dev_dependencies:
  analyzer: ^14.0.0
  # Content-digest pin for sefstars.txt (test/integration/ephemeris_release_test.dart)
  crypto: ^3.0.6
  lints: ^6.0.0
  test: ^1.25.6
  # Reads the flutter: assets: block back (test/integration/wasm_asset_test.dart)
  yaml: ^3.1.3

hook:
  build:
    enabled: true

# Flutter consumers get the web wasm artifacts bundled automatically at
# assets/packages/swisseph_rs/wasm/ -- see `wasmAssetPath` in lib/. This block
# is inert for pure-Dart consumers (CLI, server, Dart VM FFI), which never load
# these files. Declared file-by-file so wasm/build.sh and wasm/lib-random-fill.js
# (build inputs, not runtime artifacts) stay out of consumer bundles.
flutter:
  assets:
    - wasm/swisseph_ffi.js
    - wasm/swisseph_ffi.wasm
