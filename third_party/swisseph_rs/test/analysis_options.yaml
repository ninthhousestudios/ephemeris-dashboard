include: ../analysis_options.yaml

linter:
  rules:
    # Off in tests only. A test is arrange/act/assert -- a deliberate statement
    # sequence -- so a repeated receiver is structure, not noise. Folding the
    # arrange into the declaration also costs debuggability: a call that throws
    # inside a cascade is attributed to the declaration line, which is exactly
    # the wrong answer when you are diagnosing a failing test.
    cascade_invocations: false
